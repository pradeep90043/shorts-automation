name: Check secrets

# Answers two questions without ever printing a secret (GitHub masks them in the logs):
#  1. Can RENDER_GITHUB_TOKEN (the server's GITHUB_TOKEN) read Actions on shorts-automation and my-video, and dispatch workflows on
#     shorts-automation? The dispatch check sends no inputs on purpose: GitHub checks permission first, so 422 means "allowed, but
#     required inputs are missing" (nothing runs) and 403/404 means the token has no access.
#  2. Does the live dashboard accept the DASHBOARD_PASSWORD secret? (It does only if the server was deployed with that value.)
# Runs by hand (Actions -> Check secrets -> Run workflow) and on a pull request that changes this file.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/check-secrets.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.RENDER_GITHUB_TOKEN }}
      PW: ${{ secrets.DASHBOARD_PASSWORD }}
      SITE: https://shorts-automation.duckdns.org
    steps:
      - name: 1 - the GitHub token
        run: |
          [ -n "$TOKEN" ] || { echo "RENDER_GITHUB_TOKEN is not set"; exit 1; }
          api() { curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          echo "token type / scopes (a classic token lists scopes, a fine-grained one lists none):"
          curl -sI -H "Authorization: Bearer $TOKEN" https://api.github.com/user | grep -i -E "^(HTTP|x-oauth-scopes|github-authentication-token-expiration)" || true
          fail=0
          check() { printf '%-70s %s\n' "$1" "$2"; printf '%s' "$2" | grep -Eqx "$3" || fail=1; }
          check "shorts-automation: read workflows (want 200)" "$(api https://api.github.com/repos/pradeep90043/shorts-automation/actions/workflows)" 200
          check "shorts-automation: read run artifacts (want 200)" "$(api https://api.github.com/repos/pradeep90043/shorts-automation/actions/runs/38221873160/artifacts)" 200
          check "shorts-automation: dispatch voicebox-scenes (want 422 = allowed)" "$(api -X POST -d '{"ref":"main","inputs":{}}' https://api.github.com/repos/pradeep90043/shorts-automation/actions/workflows/voicebox-scenes.yml/dispatches)" "422|204"
          check "my-video: read workflows (want 200)" "$(api https://api.github.com/repos/pradeep90043/my-video/actions/workflows)" 200
          [ "$fail" = 0 ] && echo "TOKEN OK" || { echo "TOKEN CANNOT do everything above: give it Actions read+write on shorts-automation (classic: repo + workflow scopes)"; exit 1; }

      - name: 2 - the dashboard password
        if: always()
        run: |
          [ -n "$PW" ] || { echo "DASHBOARD_PASSWORD secret is not set"; exit 1; }
          headers=$(curl -s -o /dev/null -D - -c jar.txt --data-urlencode "password=$PW" --data-urlencode "next=/" "$SITE/login")
          echo "$headers" | head -1
          if echo "$headers" | grep -qi '^set-cookie: dash_session='; then
            echo "LOGIN OK: the live server accepts the DASHBOARD_PASSWORD secret"
            printf '%-70s %s\n' "signed in: GET /api/channels (want 200)" "$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt "$SITE/api/channels")"
            printf '%-70s %s\n' "not signed in: GET /api/channels (want 401)" "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/api/channels")"
          else
            echo "LOGIN FAILED: the server does not use this password yet. Deploy again (deploy.yml copies the secret into the server's .env)"
            exit 1
          fi
