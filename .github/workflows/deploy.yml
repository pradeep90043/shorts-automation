name: CI/CD Deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create .env file for production
        run: echo "${PRODUCTION_ENV}" > .env
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}

      - name: Create cookies.txt file for production
        run: echo "${PRODUCTION_COOKIES}" > cookies.txt
        env:
          PRODUCTION_COOKIES: ${{ secrets.PRODUCTION_COOKIES }}

      - name: Copy files to VM via Rsync
        run: |
          # Set up SSH key
          mkdir -p ~/.ssh
          echo "${VM_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Ensure rsync is installed on the remote host (supports apt-get for Ubuntu and dnf for Oracle Linux)
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -p 22 "${VM_USER}@${VM_HOST}" "
            if ! command -v rsync >/dev/null 2>&1; then
              echo 'rsync not found. Installing...'
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y rsync
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y rsync
              fi
            fi
          "

          # Create remote directory
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -p 22 "${VM_USER}@${VM_HOST}" "mkdir -p ~/shorts-automation"

          # Sync project files incrementally (excludes node_modules, temp, logs, output, and git files)
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -p 22" \
            --exclude 'node_modules' \
            --exclude 'temp' \
            --exclude 'logs' \
            --exclude 'output' \
            --exclude '.git' \
            --exclude '.claude' \
            --exclude '.github' \
            ./ "${VM_USER}@${VM_HOST}:~/shorts-automation/"
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_KEY: ${{ secrets.VM_KEY }}

      - name: Restart Docker Containers on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          command_timeout: "30m"
          script: |
            cd ~/shorts-automation
            # Ensure runtime directories exist
            mkdir -p temp output logs
            # If Caddyfile was wrongly created as a directory by docker, remove it
            if [ -d ~/shorts-automation/Caddyfile ]; then
              rm -rf ~/shorts-automation/Caddyfile
            fi
            # Gracefully stop containers and clean up any stale container name conflicts
            docker compose down --remove-orphans --timeout 10 || true
            # Force-remove all known containers (including stale/orphaned ones like ngrok)
            docker rm -f codeorcap-bot freellmapi duckdns caddy-proxy ngrok-dashboard-tunnel 2>/dev/null || true
            # Prune any dangling networks left by failed containers (fixes "No such container" link errors)
            docker network prune -f 2>/dev/null || true
            # Rebuild and restart container services (force-recreate avoids stale container ID references)
            docker compose up --build -d --remove-orphans --force-recreate
