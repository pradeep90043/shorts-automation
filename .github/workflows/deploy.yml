name: CI/CD Deploy to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Build the Docker image on a fast GitHub runner and push to GHCR.
  # The Dockerfile is multi-stage: it compiles TypeScript itself, so no
  # separate `npm run build` is needed here.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with my-video submodule)
        uses: actions/checkout@v4
        with:
          # my-video is a separate (private) repo: GITHUB_TOKEN can't read it, so
          # add a PAT with repo read access as the MY_VIDEO_TOKEN secret. Without
          # the secret/submodule the image still builds, stickman renderer off.
          submodules: ${{ secrets.MY_VIDEO_TOKEN != '' }}
          token: ${{ secrets.MY_VIDEO_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain single-arch manifest — avoids attestation/manifest-list quirks
          # when an older Docker on the VM does `compose pull`.
          provenance: false
          sbom: false

  # ───────────────────────────────────────────────────────────────────────────
  # Ship config to the VM and roll the container to the freshly-built image.
  # No image build happens on the VM anymore — it just pulls.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialise prod secrets
        run: |
          printf '%s\n' "${PRODUCTION_ENV}" > .env
          printf '%s\n' "${PRODUCTION_COOKIES}" > cookies.txt
          # Enables offloading long-video renders to GitHub Actions (my-video repo)
          if [ -n "${RENDER_GITHUB_TOKEN}" ]; then printf 'GITHUB_TOKEN=%s\n' "${RENDER_GITHUB_TOKEN}" >> .env; fi
          # The dashboard login password. Appended last, so it wins over any older DASHBOARD_PASSWORD line inside PRODUCTION_ENV.
          if [ -n "${DASHBOARD_PASSWORD}" ]; then printf 'DASHBOARD_PASSWORD=%s\n' "${DASHBOARD_PASSWORD}" >> .env; fi
          # Cover-image API (src/cover/coverImage.ts). Only PRODUCTION_ENV and the secrets listed here reach the server, so a
          # separate repository secret has to be copied in like this (the last line of a key wins over one inside PRODUCTION_ENV).
          if [ -n "${COVER_IMAGE_API_KEY}" ]; then printf 'COVER_IMAGE_API_KEY=%s\n' "${COVER_IMAGE_API_KEY}" >> .env; fi
          if [ -n "${COVER_IMAGE_API_URL}" ]; then printf 'COVER_IMAGE_API_URL=%s\n' "${COVER_IMAGE_API_URL}" >> .env; fi
          printf 'FREELLMAPI_FALLBACK_URL=http://freellmapi-dev:3001\n' >> .env
          printf 'FREELLMAPI_FALLBACK_KEY=freellmapi-98c9da4ce2b9a5149e83d5345b05bacabc2a4aab75a569bc\n' >> .env
          printf 'FREELLMAPI_DEV_ENCRYPTION_KEY=026653c9d168432691e1fbc8f9e16982d9296991044bae9e7c4c7b21ba52a593\n' >> .env
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          RENDER_GITHUB_TOKEN: ${{ secrets.RENDER_GITHUB_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          COVER_IMAGE_API_KEY: ${{ secrets.COVER_IMAGE_API_KEY }}
          COVER_IMAGE_API_URL: ${{ secrets.COVER_IMAGE_API_URL }}
          PRODUCTION_COOKIES: ${{ secrets.PRODUCTION_COOKIES }}

      - name: Rsync runtime files to VM
        run: |
          mkdir -p ~/.ssh
          # A private key MUST end with a newline or ssh reports "error in libcrypto".
          printf '%s\n' "${VM_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22"
          $SSH "${VM_USER}@${VM_HOST}" "mkdir -p ~/shorts-automation"
          # Only what the VM actually needs: compose file, Caddyfile, prod secrets,
          # and the bind-mounted asset dirs. Everything else lives in the image.
          rsync -avz --delete -e "$SSH" \
            --exclude 'node_modules' \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '.agents' \
            --exclude 'temp' --exclude 'logs' --exclude 'output' \
            --exclude 'dist' --exclude 'src' --exclude 'scripts' --exclude 'public' \
            --exclude 'tests' --exclude 'test-assets' \
            --exclude 'website-audit-reel' --exclude 'my-video' --exclude 'data' \
            ./ "${VM_USER}@${VM_HOST}:~/shorts-automation/"
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_KEY: ${{ secrets.VM_KEY }}

      - name: Pull image and restart on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          command_timeout: "15m"
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -e
            cd ~/shorts-automation
            mkdir -p temp output logs data
            # Caddy sometimes gets its config file created as a dir on first run
            [ -d ./Caddyfile ] && rm -rf ./Caddyfile || true
            for attempt in {1..5}; do
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin && break || {
                echo "Docker login failed (attempt $attempt), retrying in 5s..."
                sleep 5
              }
            done
            for attempt in {1..5}; do
              docker compose pull bot && break || {
                echo "Docker compose pull failed (attempt $attempt), retrying in 10s..."
                sleep 10
              }
            done
            # Clear any stale/orphaned containers left with these fixed names so
            # `up` doesn't hit "name already in use" conflicts.
            docker rm -f codeorcap-bot freellmapi freellmapi-dev duckdns caddy-proxy 2>/dev/null || true
            docker compose up -d --remove-orphans
            docker logout ghcr.io || true
            docker image prune -f || true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
