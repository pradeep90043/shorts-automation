name: Voicebox image

# Builds the CPU image of our Voicebox fork (pradeep90043/voicebox, a pinned copy of jamiepine/voicebox) and pushes it to
# GHCR, so voicebox-tts.yml can start it in about a minute instead of building torch + the TTS engines every time.
# Run it by hand, once, and again whenever the fork's ref is bumped.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref (tag, branch or commit) of pradeep90043/voicebox to build
        default: main
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the torch image is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Check out the Voicebox fork
        uses: actions/checkout@v4
        with:
          repository: pradeep90043/voicebox
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (CPU)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PYTORCH_VARIANT=cpu
          tags: ghcr.io/pradeep90043/voicebox-cpu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
