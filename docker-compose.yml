services:
  bot:
    # Image is built & pushed by GitHub Actions (.github/workflows/deploy.yml).
    # Override the tag with BOT_IMAGE if needed; defaults to :latest.
    image: ${BOT_IMAGE:-ghcr.io/pradeep90043/shorts-automation:latest}
    pull_policy: always
    container_name: codeorcap-bot
    restart: unless-stopped
    env_file: .env
    # Chromium (Remotion renders) needs more than Docker's 64MB default /dev/shm; only used while rendering
    shm_size: 1gb
    environment:
      - FREELLMAPI_URL=http://freellmapi:3001
      - FREELLMAPI_FALLBACK_URL=${FREELLMAPI_FALLBACK_URL:-http://freellmapi-dev:3001}
      - FREELLMAPI_FALLBACK_KEY=${FREELLMAPI_FALLBACK_KEY:-freellmapi-98c9da4ce2b9a5149e83d5345b05bacabc2a4aab75a569bc}
      # The VM is always prod: forces *_TELEGRAM_BOT_TOKEN_PROD variants regardless of .env
      - BOT_ENV=prod
      - TZ=Asia/Kolkata
    depends_on:
      - freellmapi
      - freellmapi-dev
      - postgres
    volumes:
      - ./output:/app/output
      - ./assets/music:/app/assets/music
      - ./assets/stickers:/app/assets/stickers
      - ./assets/templates:/app/assets/templates
      - ./logs:/app/logs
      - ./cookies.txt:/app/cookies.txt
      # Persistent app data (stickman render timings + job history); survives redeploys
      - ./data:/root/.shorts-automation
    # Ports: 3000 (OAuth flow), 3002 (Live Logs server)
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3002:3002"

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLMAPI_ENCRYPTION_KEY}
    volumes:
      - freellmapi-data:/app/server/data

  freellmapi-dev:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi-dev
    restart: unless-stopped
    ports:
      - "20128:3001"
    environment:
      - PORT=3001
      - ENCRYPTION_KEY=${FREELLMAPI_DEV_ENCRYPTION_KEY:-026653c9d168432691e1fbc8f9e16982d9296991044bae9e7c4c7b21ba52a593}
    volumes:
      - ${FREELLMAPI_DEV_DATA_DIR:-/home/opc/freellmapi-dev/data}:/app/server/data

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=botuser
      - POSTGRES_PASSWORD=botpass
      - POSTGRES_DB=shortsbot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # Automatic DuckDNS IP updater (keeps shorts-dashboard.duckdns.org pointing to server IP)
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN:-shorts-automation}
      - TOKEN=${DUCKDNS_TOKEN}

  # Caddy Reverse Proxy (Free Automatic HTTPS SSL Cert for DuckDNS)
  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_SUBDOMAIN:-shorts-automation}.duckdns.org
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  freellmapi-data:
  caddy_data:
  caddy_config:
  postgres-data:
