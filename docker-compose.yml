services:
  bot:
    # Image is built & pushed by GitHub Actions (.github/workflows/deploy.yml).
    # Override the tag with BOT_IMAGE if needed; defaults to :latest.
    image: ${BOT_IMAGE:-ghcr.io/pradeep90043/shorts-automation:latest}
    container_name: codeorcap-bot
    restart: unless-stopped
    env_file: .env
    # Chromium (Remotion renders) needs more than Docker's 64MB default /dev/shm; only used while rendering
    shm_size: 1gb
    environment:
      - FREELLMAPI_URL=http://freellmapi:3001
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-codeorcap@2026}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # The VM is always prod
      - BOT_ENV=prod
      - LONG_RELEASE_IST=20:00   # long videos stay private and go public at 8 pm IST
      - TZ=Asia/Kolkata
    depends_on:
      - freellmapi
      - postgres
    volumes:
      - ./output:/app/output
      - ./assets/music:/app/assets/music
      - ./assets/stickers:/app/assets/stickers
      - ./assets/templates:/app/assets/templates
      - ./logs:/app/logs
      - ./cookies.txt:/app/cookies.txt
      # Persistent app data (stickman render timings + job history); survives redeploys
      - ./data:/root/.shorts-automation
    # Ports: 3000 (OAuth flow), 3002 (Live Logs server)
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3002:3002"

  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=128
      - ENCRYPTION_KEY=${FREELLMAPI_ENCRYPTION_KEY}
    volumes:
      - freellmapi-data:/app/server/data


  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=botuser
      - POSTGRES_PASSWORD=botpass
      - POSTGRES_DB=shortsbot
    # The default settings assume a big server; this VM has 1 GB for everything.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB", "-c", "effective_cache_size=128MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # Automatic DuckDNS IP updater (keeps shorts-dashboard.duckdns.org pointing to server IP)
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN:-shorts-automation}
      - TOKEN=${DUCKDNS_TOKEN}

  # DuckDNS IP updater for Dev (keeps shorts-dev.duckdns.org pointing to server IP)
  duckdns-dev:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns-dev
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - SUBDOMAINS=${DEV_DUCKDNS_SUBDOMAIN:-shorts-dev}
      - TOKEN=${DEV_DUCKDNS_TOKEN:-0c4336fe-1453-4aa3-ad42-feea06535294}

  # Dev environment (bot + FreeLLMAPI) runs entirely on GitHub-hosted runners (.github/workflows/dev-session.yml).
  # This Oracle VM runs production only.

  # Caddy Reverse Proxy (Free Automatic HTTPS SSL Cert for DuckDNS)
  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCKDNS_DOMAIN=${DUCKDNS_SUBDOMAIN:-shorts-automation}.duckdns.org
      - DEV_DUCKDNS_DOMAIN=${DEV_DUCKDNS_SUBDOMAIN:-shorts-dev}.duckdns.org
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  freellmapi-data:
  caddy_data:
  caddy_config:
  postgres-data:
